name: Build Raphael kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raphael-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build kernel packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout build files
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio debhelper dpkg-dev \
            dwarves fakeroot flex git kmod libdw-dev libelf-dev \
            libssl-dev python3 rsync wget xz-utils zstd

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Build Raphael kernel
        env:
          KERNEL_REPOSITORY: https://github.com/GengWei1997/linux.git
          KERNEL_BRANCH: raphael-7.1
        run: bash scripts/build.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raphael-kernel-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
