name: Build Raphael DSI brightness flicker test kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raphael-dsi-brightness-flicker-kernel
  cancel-in-progress: false

jobs:
  build:
    name: Build kernel packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout build files
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang cpio debhelper dpkg-dev \
            dwarves fakeroot flex git kmod libdw-dev libelf-dev \
            libssl-dev lld llvm python3 rsync xz-utils zstd

      - name: Build Raphael kernel
        env:
          KERNEL_REPOSITORY: https://github.com/GengWei1997/linux.git
          KERNEL_BRANCH: raphael-7.1
        run: bash scripts/build.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raphael-dsi-brightness-flicker-test-kernel
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
